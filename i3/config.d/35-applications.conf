# Application controls
bindsym XF86HomePage exec firefox
bindsym XF86Calculator exec speedcrunch
bindsym $mod+Control+c exec speedcrunch
bindsym Mod4+e exec nautilus --no-desktop
bindsym $mod+Control+e exec nautilus --no-desktop
bindsym $mod+Control+Shift+e exec kitty -e ranger
bindsym $mod+Control+Shift+c exec dmenu_bash_command
bindsym $mod+equal exec --no-startup-id toggle_meeting_mute
bindsym $mod+Shift+b exec dmenu_bookmarks

# GNOME settings
bindsym $mod+Control+Shift+s exec XDG_CURRENT_DESKTOP=GNOME gnome-control-center
bindsym XF86Tools exec XDG_CURRENT_DESKTOP=GNOME gnome-control-center

set $mode_screenshot Screenshot (w)indow to clipboard, (W)indow to file, (s)creen to clipboard, (S)creen to file, (f)lameshot
mode "$mode_screenshot" {
    bindsym w exec --no-startup-id scrot --focused - | xclip -selection clipboard -target image/png && notify-send 'SCREENSHOT' 'Copied active window screenshot to clipboard.'; mode "default"
    bindsym Shift+w exec --no-startup-id scrot --focused && notify-send 'SCREENSHOT' 'Saved active window screenshot to file.'; mode "default"
    bindsym s exec --no-startup-id scrot - | xclip -selection clipboard -target image/png && notify-send 'SCREENSHOT' 'Copied fullscreen screenshot to clipboard.'; mode "default"
    bindsym Shift+s exec --no-startup-id scrot && notify-send 'SCREENSHOT' 'Saved fullscreen screenshot to file.'; mode "default"
    bindsym f exec --no-startup-id flameshot gui; mode "default"

    # back to normal: Enter or Escape
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym Print mode "$mode_screenshot"
bindsym $mod+Shift+p mode "$mode_screenshot"

